name: US Market Daily Report

on:
  schedule:
    # 北京时间周二至周六 05:30 运行 (对应 UTC 21:30)
    - cron: '30 21 * * 1-5'
  workflow_dispatch: # 支持手动测试

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install Dependencies
        run: pip install tigeropen requests

      - name: Run Script
        env:
          TIGER_ID: ${{ secrets.TIGER_ID }}
          TIGER_PRIVATE_KEY: ${{ secrets.TIGER_PRIVATE_KEY }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python top_stocks.py
