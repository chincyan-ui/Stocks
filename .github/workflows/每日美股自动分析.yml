name: 每日美股自动分析

on:
  schedule:
    - cron: '5 23 * * *'
  workflow_dispatch: 

jobs:
  run_analysis:
    name: 执行自动化分析任务
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v3

      - name: 安装 Python 环境
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: 安装必要依赖库
        run: |
          pip install pandas yfinance openpyxl requests

      - name: 运行回撤计算脚本
        run: python "美股回撤计算器.py"

      - name: 将 Excel 提交到仓库
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add *.xlsx
          git commit -m "自动更新回撤报告: $(date +'%Y-%m-%d')"
          git push
