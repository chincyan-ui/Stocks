name: QQQ和OAS自动报表

on:
  schedule:
    # 北京时间周二至周六 08:30 (UTC 00:30)
    - cron: '30 0 * * 2-6'
  workflow_dispatch: 

jobs:
  run_market_report:
    runs-on: ubuntu-latest
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4 # 升级到 v4，更快更安全

      - name: 设置 Python 3.10
        uses: actions/setup-python@v5 # 升级到 v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          # 预先安装兼容版本，防止 yfinance 自动安装不兼容的新版 numpy
          pip install numpy==1.26.4
          pip install yfinance pandas pandas_datareader requests pytz

      - name: 执行 Python 脚本
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
        # 关键点：使用双引号包裹中文文件名
        run: python "QQQ和OAS.py"
