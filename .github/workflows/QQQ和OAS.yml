name: QQQ和OAS自动报表

on:
  schedule:
    # 每天北京时间 08:30 运行 (UTC 00:30)
    # 分 时 日 月 周
    - cron: '30 16 * * *'
  workflow_dispatch: 

jobs:
  run_market_report:
    runs-on: ubuntu-latest
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          # 保持 numpy 版本锁定以确保 yfinance 稳定性
          pip install numpy==1.26.4
          pip install yfinance pandas pandas_datareader requests pytz

      - name: 执行 Python 脚本
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
        # 保持双引号包裹中文文件名
        run: python "QQQ和OAS.py"
