name: OAS Monitor

on:
  schedule:
    # 每天美东收盘后运行
    - cron: '30 21 * * 1-5' 
  workflow_dispatch: 

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          # 注意：删除了可能引起 Gradle 报错的 cache 选项

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # 核心修复：强制降级 pandas 以解决 deprecate_kwarg 错误
          # 并确保安装了解析网页所需的 lxml 和数据源 yfinance
          pip install "pandas<2.0.0" 
          pip install yfinance pandas_datareader requests lxml

      - name: Run monitor
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python monitor2.py

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          # 检查文件是否存在并提交
          if [ -f "last_list.json" ]; then
            git add last_list.json
            git commit -m "Update daily tracking data" || echo "No changes to commit"
            git push
          else
            echo "last_list.json not found, skipping commit."
          fi
