name: OAS Monitor

on:
  schedule:
    # 每天美东收盘后运行（北京时间清晨 5:05 或 6:05）
    - cron: '30 21 * * 1-5' 
  workflow_dispatch: # 保留手动测试按钮

# 增加写入权限，允许 Actions 将结果推送到你的仓库
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 第一步：必须先 Checkout 代码，否则后续脚本找不到路径
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      # 第二步：设置 Python 环境（移除了可能导致 Gradle 报错的 cache 选项）
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 第三步：安装依赖（核心修复：锁定 Pandas 版本防止 API 报错）
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "pandas<2.0.0"
          pip install yfinance pandas_datareader requests lxml

      # 第四步：执行监控脚本
      - name: Run monitor
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python monitor2.py

      # 第五步：将生成的数据推回仓库
      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          # 仅当 last_list.json 有变化时才提交
          if [ -f "last_list.json" ]; then
            git add last_list.json
            git commit -m "Update daily tracking data" || echo "No changes to commit"
            git push
          else
            echo "File last_list.json not found, skipping."
          fi
