name: SOXL Volume Monitor

on:
  schedule:
    # 每天美东收盘后运行（UTC 21:05）
    - cron: '5 21 * * 1-5' 
  workflow_dispatch: # 保留手动测试按钮

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4 # 升级到 v4

      - name: Set up Python
        uses: actions/setup-python@v5 # 修正点：由 set 改为 setup，并升级到 v5
        with:
          python-version: '3.11' # 使用更稳定的 3.11 版本

      - name: Install dependencies
        run: |
          pip install yfinance requests

      - name: Run monitor
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python monitor.py
