name: OAS Monitor

on:
  schedule:
    # 每天美东收盘后运行（北京时间清晨 5:05 或 6:05）
    - cron: '5 21 * * 1-5' 
  workflow_dispatch: # 保留手动测试按钮

# 必须增加权限，否则 Actions 无法将 json 结果推送到你的仓库
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # 取消默认的只读，允许写入
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # 确保这些库在 requirements.txt 中：yfinance, pandas_datareader, pandas, requests, lxml
          pip install yfinance pandas_datareader pandas requests lxml

      - name: Run monitor
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python monitor2.py

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          # 检查 json 文件是否有更新
          if [ -f "last_list.json" ]; then
            git add last_list.json
            git commit -m "Update daily billionaire tracking data" || echo "No changes to commit"
            git push
          fi
