name: OAS Monitor

on:
  schedule:
    - cron: '30 21 * * 1-5' 
  workflow_dispatch: 

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          # 注意：绝对不要在这里写 cache: 'gradle'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # 核心修复：降级 Pandas 确保 pandas_datareader 不报错
          pip install "pandas<2.0.0" 
          pip install yfinance pandas_datareader requests lxml html5lib

      - name: Run monitor
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python monitor2.py

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          if [ -f "last_list.json" ]; then
            git add last_list.json
            git commit -m "Update daily tracking data" || echo "No changes to commit"
            git push
          fi
