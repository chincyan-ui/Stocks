name: LongPort Daily Turnover Report

# 触发条件
on:
  schedule:
    # 每天美股收盘后运行（UTC 21:00，约北京时间凌晨 5:00）
    - cron: '0 21 * * 1-5'
  workflow_dispatch: # 允许在 GitHub 界面手动点击“Run workflow”进行测试

jobs:
  build_and_run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # 安装长桥新版 SDK longport 和请求库 requests
          pip install longport requests

      - name: Run LongPort Script
        env:
          # 核心修正：指定区域为国内，解决 USOption 权限报错问题
          LONGPORT_REGION: cn
          
          # 以下变量需在 GitHub 仓库 Settings -> Secrets -> Actions 中配置
          LB_APP_KEY: ${{ secrets.LB_APP_KEY }}
          LB_APP_SECRET: ${{ secrets.LB_APP_SECRET }}
          LB_ACCESS_TOKEN: ${{ secrets.LB_ACCESS_TOKEN }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        
        # 运行您的极简版 Python 脚本
        run: python longport_top.py
