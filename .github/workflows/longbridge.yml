name: TSLA Turnover Push

on:
  schedule:
    # 每天北京时间 06:30 执行
    - cron: '30 22 * * *'
  workflow_dispatch: 

jobs:
  run_sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install longport requests

      - name: Execute Script
        env:
          # 环境变量名已全部更新为 LB_
          LB_APP_KEY: ${{ secrets.LB_APP_KEY }}
          LB_APP_SECRET: ${{ secrets.LB_APP_SECRET }}
          LB_ACCESS_TOKEN: ${{ secrets.LB_ACCESS_TOKEN }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python longport_top.py
