name: TSLA Turnover Push

on:
  schedule:
    # 每天北京时间早上 6:30 执行 (对应 UTC 22:30)
    - cron: '30 22 * * *'
  workflow_dispatch: # 允许手动点击按钮立即测试

jobs:
  push_report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install longport requests

      - name: Run Script
        env:
          LONGPORT_APP_KEY: ${{ secrets.LONGPORT_APP_KEY }}
          LONGPORT_APP_SECRET: ${{ secrets.LONGPORT_APP_SECRET }}
          LONGPORT_ACCESS_TOKEN: ${{ secrets.LONGPORT_ACCESS_TOKEN }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        # 这里已更新为你的新文件名
        run: python longport_top.py
