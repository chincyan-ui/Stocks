name: OAS QQQ

on:
  schedule:
    # 每天美东收盘后运行（北京时间清晨）
    - cron: '30 21 * * 1-5' 
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # 锁定版本以解决之前的 Numpy/Pandas 兼容性报错
          pip install "numpy<2.0.0" "pandas<2.0.0"
          pip install yfinance pandas_datareader requests

      - name: Run monitor
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        # 核心修复：确保这里的文件名和你的 Python 脚本名完全一致
        run: python monitor2.py
