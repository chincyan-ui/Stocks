name: 纳斯达克100监控

on:
  schedule:
    # 稍微调整一下：每天 UTC 21:45 (北京时间 05:45)
    # 1-5 是周一到周五（UTC），对应北京时间周二到周六凌晨
    - cron: '45 21 * * 1-5' 
  workflow_dispatch: # 保留手动触发按钮

jobs:
  run-monitor:
    name: 执行监控任务
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v3

      - name: 设置 Python 环境
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip' # 新增：开启缓存加快运行速度

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas requests

      - name: 执行监控脚本
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        # 建议确认仓库里的文件名是否真的是这个
        run: python 纳斯达克100监控.py
