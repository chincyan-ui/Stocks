name: 纳斯达克100监控

on:
  schedule:
    # 北京时间凌晨 05:35 运行（美股通常在 05:00 或 06:00 收盘）
    # 1-5 表示 UTC 的周一至周五，对应北京时间的周二至周六凌晨
    - cron: '35 21 * * 1-5' 
  workflow_dispatch: # 允许手动点击运行，方便测试

jobs:
  run-monitor:
    name: 执行监控任务
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v3

      - name: 设置 Python 环境
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip' # 缓存依赖，缩短运行时间

      - name: 安装必要插件
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas requests

      - name: 执行监控脚本
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONIOENCODING: utf-8  # 强制 Python 使用 UTF-8 编码处理中文字符
        # 使用引号包裹中文字符串文件名
        run: python "纳斯达克100监控.py"
