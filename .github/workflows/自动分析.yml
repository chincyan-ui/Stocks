name: 每日美股自动分析

on:
  schedule:
    # 每天北京时间早上 7:05 自动执行
    - cron: '5 23 * * *'
  workflow_dispatch: 

jobs:
  # 这里的 ID 改成英文以确保兼容性，显示名称用 name 定义
  run_analysis:
    name: 执行自动化分析任务
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v3

      - name: 安装 Python 环境
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: 安装必要依赖库
        run: |
          pip install pandas yfinance openpyxl requests

      - name: 运行回撤计算脚本
        # 这里的脚本名称必须与你仓库中的文件名完全一致
        run: python "美股回撤计算器.py"

      - name: 上传结果文件
        uses: actions/upload-artifact@v4
        with:
          name: US-Stock-Drawdown-Report
          path: "*.xlsx"
          retention-days: 90
