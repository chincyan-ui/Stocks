name: Moomoo Scraper

on:
  schedule:
    # UTC 14:30 对应北京时间 22:30（美股开盘后）
    - cron: '30 14 * * 1-5'
  workflow_dispatch: # 支持手动点击运行

jobs:
  run-scraper:
    runs-on: ubuntu-latest # 目前指向 Ubuntu 24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fix Linux Dependencies and Install Playwright
        run: |
          # 1. 核心修复：手动安装 Ubuntu 24.04 版本的音频和图形库
          sudo apt-get update
          sudo apt-get install -y libasound2t64 libgbm1
          
          # 2. 升级 Playwright 到最新版以获得更好的系统兼容性
          pip install --upgrade playwright
          
          # 3. 安装浏览器内核（跳过可能出错的自动依赖安装，因为上面已经手动补齐了）
          python -m playwright install chromium

      - name: Execute Scraper
        env:
          # 确保你在 GitHub Settings -> Secrets 中配置了这两个变量
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scraper.py
