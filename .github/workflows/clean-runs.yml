name: Clean Old Workflow Runs

on:
  schedule:
    - cron: '0 0 * * *' # 每天 UTC 0点（北京时间 8点）自动执行一次清理
  workflow_dispatch: # 支持手动触发

jobs:
  del_runs:
    runs-on: ubuntu-latest
    permissions:
      actions: write # 必须赋予 actions 写入权限，否则无法删除记录
    steps:
      - name: Delete workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          retain_days: 10   # 保留最近 3 天的记录（您可以根据需要改成 1 或 7）
          keep_minimum_runs: 1 # 每个工作流至少保留最近的 1 次运行记录
