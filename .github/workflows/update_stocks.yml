name: Update US Large Cap Stocks Issue

on:
  schedule:
    - cron: '0 19 * * *' # 每天 UTC 0点（北京时间 8点）自动运行
  workflow_dispatch: # 支持手动触发

jobs:
  update-issue:
    runs-on: ubuntu-latest
    permissions:
      contents: read   # 修复点：必须显式声明读取代码仓库的权限
      issues: write    # 赋予操作 Issue 的权限
   
    steps:
      # 1. 首先检出代码仓库
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. 然后设置 Python 环境
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 3. 接着安装依赖（如果有 requirements.txt 也可以在这里直接读到）
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install requests
          fi

      # 4. 运行 Python 脚本
      - name: Run script to fetch stocks
        run: python get_stocks2.py

      # 5. 创建或更新 GitHub Issue
      - name: Create or Update GitHub Issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          TITLE="美股市值大于1000亿美元股票汇总（自动更新）"
          
          # 检查是否存在同名的 Open 状态 Issue
          ISSUE_NUMBER=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number')
          
          if [ -z "$ISSUE_NUMBER" ]; then
            # 不存在则创建新 Issue
            gh issue create --title "$TITLE" --body-file "issue_body.md"
            echo "Created new issue."
          else
            # 存在则更新该 Issue 内容
            gh issue edit "$ISSUE_NUMBER" --body-file "issue_body.md"
            echo "Updated existing issue #$ISSUE_NUMBER."
          fi
