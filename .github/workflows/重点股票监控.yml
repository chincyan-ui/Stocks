name: 重点股票监控

on:
  schedule:
    # 这里的 cron 是 UTC 时间，北京时间凌晨 05:30 运行
    - cron: '30 21 * * 1-5' 
  workflow_dispatch: 

jobs:
  run-monitor:  # 这里修改了：ID 必须使用英文或下划线
    name: 执行监控任务  # 显示名称可以继续用中文
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v3

      - name: 设置 Python 环境
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 安装必要插件
        run: pip install yfinance requests

      - name: 执行监控脚本
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        # 确保这里的文件名和你的 py 文件名完全一致
        run: python 监控脚本.py
