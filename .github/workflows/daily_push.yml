name: Daily Stock Push

on:
  schedule:
    # 每天北京时间早上 05:30 运行 (UTC 21:30)
    - cron: '30 21 * * 1-5' 
  workflow_dispatch: # 允许手动测试

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: pip install requests

      - name: Run script
        env:
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }} # 已同步修改
        run: python stock_pusher.py
