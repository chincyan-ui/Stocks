name: Daily OAS Notification

on:
  schedule:
    - cron: '30 13 * * *' # 每天北京时间 21:30 运行（避开美股开盘初段数据波动）
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Libs
        run: pip install yfinance pandas requests

      - name: Run daily_oas.py
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python daily_oas.py
